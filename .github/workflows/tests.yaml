name: Local fixture and R integration tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python test dependencies (no atlas downloads)
        run: python -m pip install -r inst/python/requirements.txt -r scripts/requirements-benchmark.txt pytest anndata
      - name: Python fixture suite
        run: python -m pytest tests/python -q --junitxml=python-tests.xml
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Install package for automatic Python smoke test
        run: R CMD INSTALL .
      - name: Automatic managed Python setup (no user path)
        shell: Rscript {0}
        run: |
          library(importABCatlas)
          Sys.setenv(IMPORTABCATLAS_PYTHON = "/path/that/must/not/be/used",
                     RETICULATE_PYTHON = "/path/that/must/not/be/used")
          Sys.unsetenv("IMPORTABCATLAS_PYTHON_MODE")
          setup_importABCatlas()
          info <- diagnose()
          stopifnot(identical(info$python$mode, "managed"),
                    isTRUE(info$python$available))
          x <- example_data("matrix")
          stopifnot(identical(dim(x$expression), c(4L, 3L)))
      - name: Check package and optional object integrations
        shell: Rscript {0}
        run: |
          Sys.setenv(IMPORTABCATLAS_PYTHON_MODE = "external",
                     IMPORTABCATLAS_PYTHON = unname(Sys.which("python")))
          rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: |
            python-tests.xml
            check/
            *.Rcheck/
