name: importABCatlas bug report
description: Report a reproducible package, data-routing, download, or object-construction problem.
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: importABCatlas version or Git commit
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Dataset route and data type
      placeholder: e.g. HMBA_Macaque / raw
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact R command
      render: r
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Complete error and diagnostic directory
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS/architecture, R version, complete diagnose() output, Allen release, cache state, and free disk space. diagnose() reports the managed Python environment automatically.
    validations:
      required: true
  - type: dropdown
    id: reproducible
    attributes:
      label: Reproducible after restarting R?
      options: ["Yes", "No", "Not tested"]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data handling
      options:
        - label: I did not attach Allen H5AD files or sensitive donor/cell-level data.
          required: true
